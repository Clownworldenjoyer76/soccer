probability_sources:
  soccer:
    match_odds:
      ev: engine
      kelly: engine
      fair_odds: engine
      edge: engine
      selection_filter: engine

# Fixed chronological split for threshold tuning/evaluation.
#
# Threshold bands in this file may be tuned only from matches inside:
#   tuning_start through tuning_end
#
# Matches on/after evaluation_start are out-of-sample evaluation matches.
# They must not be used to choose or modify threshold bands.
backtest_policy:
  soccer:
    tuning_start: "2026_04_06"
    tuning_end: "2026_08_30"
    evaluation_start: "2026_08_31"

# For BTTS and totals, fair_odds = 1 / model_probability.
# Therefore edge = book_odds / fair_odds - 1 = EV.
# edge is retained as an output compatibility alias only.
# edge_bands are intentionally disabled for these markets so EV and edge
# are not treated as independent confirmation signals.
signal_relationships:
  soccer:
    btts:
      edge: alias_of_ev
      edge_bands: disabled_redundant_filter
    total25:
      edge: alias_of_ev
      edge_bands: disabled_redundant_filter
    total35:
      edge: alias_of_ev
      edge_bands: disabled_redundant_filter

markets:
  soccer:

