probability_sources:
  soccer:
    match_odds:
      ev: engine
      kelly: engine
      fair_odds: engine
      edge: engine
      selection_filter: engine

# For BTTS and totals, fair_odds = 1 / model_probability.
# Therefore edge = book_odds / fair_odds - 1 = EV.
# edge is retained as an output compatibility alias only.
# edge_bands are intentionally disabled for these markets so EV and edge
# are not treated as independent confirmation signals.

#######################################################################################################################
#######################################################################################################################
### SELECTION OPTIONS ###
# For every league and every market section (match_odds, btts, total25, total35), the selector currently has only two behaviors:

  # selection_mode: all_qualifying → select every side that passes the filters.
      ## Anything other than all_qualifying → select one qualifying side only.
      
  ## IMPORTANT ##
  # pick_preference is only used when selection_mode is not all_qualifying.
      ## pick_preference controls which single qualifying side is chosen when selection_mode is not all_qualifying.
      ## pick_preference options: ev,kelly,odds,american_odds,model_prob,edge
        ## direction: max = highest value, anything else behaves as min = lowest value


#######################################################################################################################
#######################################################################################################################
markets:
  soccer:

