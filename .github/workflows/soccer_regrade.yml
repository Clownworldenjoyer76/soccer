name: _Soccer Regrade and Reports

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-full-pipeline
  cancel-in-progress: false

jobs:
  soccer-reselect:
    runs-on: ubuntu-latest

    env:
      TZ: America/New_York

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            docs/win/soccer

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/win/soccer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/soccer/requirements.txt

      - name: Create required directories
        run: |
          mkdir -p docs/win/soccer/04_select/locked
          mkdir -p docs/win/soccer/errors/04_select
          mkdir -p docs/win/soccer/05_final_scores/intermediate
          mkdir -p docs/win/soccer/05_final_scores/errors
          mkdir -p docs/win/soccer/05_final_scores/results/final_scores
          mkdir -p docs/win/soccer/05_final_scores/results/graded
          mkdir -p docs/win/soccer/05_final_scores/results/graded_locked
          mkdir -p docs/win/soccer/05_final_scores/deeper_summaries/soccer
          mkdir -p docs/win/soccer/05_final_scores/model_evaluation
          touch docs/win/soccer/05_final_scores/soccer_market_tally.csv

      # Rebuild selections from existing Stage-3 edge files using current markets.yaml.
      - name: Soccer select
        run: python docs/win/soccer/scripts/04_select/soccer_select_bets.py

      # Master games files are the game_id source for this step.
      - name: Add game IDs to soccer final scores
        run: python docs/win/soccer/scripts/00_intake/soccer_add_game_id.py

      # -------------------------
      # RESULTS
      # -------------------------
      - name: Run soccer results grade
        run: python docs/win/soccer/scripts/05_final_scores/01_soccer_results_grade.py

      - name: Run soccer results analyze
        run: python docs/win/soccer/scripts/05_final_scores/02_soccer_results_analyze.py

      - name: Run soccer results reports
        run: python docs/win/soccer/scripts/05_final_scores/03_soccer_results_reports.py

      # -------------------------
      # ALL-MATCH MODEL EVALUATION
      # -------------------------
      - name: Run soccer model grade
        run: python docs/win/soccer/scripts/05_final_scores/04_soccer_model_grade.py

      - name: Run soccer model reports
        run: python docs/win/soccer/scripts/05_final_scores/05_soccer_model_reports.py

      - name: Show reselect outputs and logs
        if: always()
        run: |
          echo "=== Rebuilt soccer selections ==="
          find docs/win/soccer/04_select \
            -maxdepth 1 \
            -type f \
            -name "*_soccer_bets.csv" \
            -print | sort || true

          echo "=== Model evaluation outputs ==="
          find docs/win/soccer/05_final_scores/model_evaluation \
            -maxdepth 1 \
            -type f \
            -name "*.csv" \
            -print | sort || true

          echo "=== Selection log ==="
          cat docs/win/soccer/errors/04_select/select_bets.txt || true

          echo "=== Add game ID logs ==="
          cat docs/win/soccer/05_final_scores/errors/01_soccer_add_game_id_summary.txt || true
          cat docs/win/soccer/05_final_scores/errors/01_soccer_add_game_id_errors.txt || true

          echo "=== Final score logs ==="
          cat docs/win/soccer/05_final_scores/errors/soccer_results_grade_summary.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_results_grade_errors.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_results_analyze_summary.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_results_analyze_errors.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_results_reports_summary.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_results_reports_errors.txt || true

          echo "=== Model evaluation logs ==="
          cat docs/win/soccer/05_final_scores/errors/soccer_model_grade_summary.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_model_grade_errors.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_model_reports_summary.txt || true
          cat docs/win/soccer/05_final_scores/errors/soccer_model_reports_errors.txt || true

      # -------------------------
      # ONE FINAL REPO WRITE
      # -------------------------
      - name: Commit soccer reselect outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Changed files before staging:"
          git status --short

          git add -A docs/win/soccer/

          echo "Changed files after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No soccer reselect changes to commit."
          else
            git commit -m "chore: soccer reselect and reports $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin main
          fi
